name: Lekapro
options:
  bundleIdPrefix: app.lekapro
  deploymentTarget:
    iOS: '16.1'
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: '5.0'
    SWIFT_STRICT_CONCURRENCY: targeted
    IPHONEOS_DEPLOYMENT_TARGET: '16.1'
    TARGETED_DEVICE_FAMILY: '1,2'
    MARKETING_VERSION: '0.3.0'
    CURRENT_PROJECT_VERSION: '32'
    ENABLE_DEBUG_DYLIB: NO
targets:
  Lekapro:
    type: application
    platform: iOS
    sources:
      - path: Lekapro
        excludes: [Info.plist]
    info:
      path: Lekapro/Info.plist
      properties:
        CFBundleDisplayName: Lekapro
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIRequiresFullScreen: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSCameraUsageDescription: Cho phép website dùng camera thật khi bạn đồng ý.
        NSMicrophoneUsageDescription: Cho phép website dùng microphone khi bạn đồng ý.
        NSLocalNetworkUsageDescription: Kết nối proxy do bạn cấu hình trong mạng nội bộ.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoadsInWebContent: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.lekapro.browser
        GENERATE_INFOPLIST_FILE: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_OBJC_BRIDGING_HEADER: Lekapro/Lekapro-Bridging-Header.h
  LekaproTests:
    type: bundle.unit-test
    platform: iOS
    sources: [LekaproTests]
    dependencies:
      - target: Lekapro
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: app.lekapro.tests
schemes:
  Lekapro:
    build:
      targets:
        Lekapro: all
        LekaproTests: [test]
    test:
      targets: [LekaproTests]
      gatherCoverageData: true
