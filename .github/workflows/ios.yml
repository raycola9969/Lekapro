name: iOS build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-isolated-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
          brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Verify homepage reader
        run: node scripts/test-homepage-reader.cjs
      - name: Build for iPhone
        run: |
          mkdir -p build
          set -o pipefail
          xcodebuild -project Lekapro.xcodeproj -scheme Lekapro -configuration Debug -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/device CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build | tee build/device-build.log
      - name: Package unsigned IPA
        run: |
          mkdir -p build/ipa/Payload
          ditto build/device/Build/Products/Debug-iphoneos/Lekapro.app build/ipa/Payload/Lekapro.app
          cd build/ipa
          zip -qr Lekapro-unsigned.ipa Payload
          shasum -a 256 Lekapro-unsigned.ipa > SHA256.txt
          printf 'Unsigned iOS build. Sign before installing on a device.\nCommit: %s\n' "$GITHUB_SHA" > BUILD-INFO.txt
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Lekapro-unsigned
          path: |
            build/ipa/Lekapro-unsigned.ipa
            build/ipa/SHA256.txt
            build/ipa/BUILD-INFO.txt
          retention-days: 7
      - name: Select simulator
        env:
          LIVE_FINGERPRINT: ${{ contains(github.event.head_commit.message, '[live-probe]') && '1' || '0' }}
          LIVE_CASES: ${{ contains(github.event.head_commit.message, '[quota-joint]') && 'quota-audio-ua' || '' }}
        run: |
          xcrun simctl list devices available -j > build/simulators.json
          xcrun simctl list runtimes -j > build/runtimes.json
          export SIMULATOR_SDK_VERSION=$(xcrun --sdk iphonesimulator --show-sdk-version)
          python3 - <<'PY'
          import json, os, re, pathlib, xml.etree.ElementTree as ET
          data = json.load(open('build/simulators.json'))
          sdk = tuple(map(int, os.environ['SIMULATOR_SDK_VERSION'].split('.')))
          def version(runtime):
              match = re.search(r'iOS-(\d+)-(\d+)', runtime)
              return tuple(map(int, match.groups())) if match else (0, 0)
          candidates = [(runtime, device) for runtime, devices in data['devices'].items() if 'iOS' in runtime and version(runtime) <= sdk for device in devices if device['isAvailable'] and device['name'].startswith('iPhone')]
          if not candidates:
              raise SystemExit('No available iPhone simulator')
          runtime, device = max(candidates, key=lambda item: (version(item[0]), item[1]['name']))
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('SIMULATOR_ID=' + device['udid'] + '\n')
          print('Using', runtime, device['name'])
          # WebKit bug 293831: iOS 18.5 stores its Swift overlay in Cryptexes.
          # Apply the upstream test-only workaround without changing the IPA.
          # https://bugs.webkit.org/show_bug.cgi?id=293831#c2
          entry = next(item for item in json.load(open('build/runtimes.json'))['runtimes'] if item['identifier'] == runtime)
          runtime_root = pathlib.Path(entry.get('runtimeRoot') or pathlib.Path(entry['bundlePath']) / 'Contents/Resources/RuntimeRoot')
          overlay = runtime_root / 'System/Cryptexes/OS/usr/lib/swift'
          scheme = pathlib.Path('Lekapro.xcodeproj/xcshareddata/xcschemes/Lekapro.xcscheme')
          tree = ET.parse(scheme)
          action = tree.getroot().find('TestAction')
          action.set('shouldUseLaunchSchemeArgsEnv', 'NO')
          variables = action.find('EnvironmentVariables')
          if variables is None:
              variables = ET.SubElement(action, 'EnvironmentVariables')
          if (overlay / 'libswiftWebKit.dylib').is_file():
              ET.SubElement(variables, 'EnvironmentVariable', key='DYLD_FALLBACK_LIBRARY_PATH', value=str(overlay), isEnabled='YES')
              print('Configured WebKit Swift overlay for simulator XCTest')
          if os.environ.get('LIVE_FINGERPRINT') == '1':
              ET.SubElement(variables, 'EnvironmentVariable', key='LEKAPRO_LIVE_FINGERPRINT', value='1', isEnabled='YES')
              if os.environ.get('LIVE_CASES'):
                  ET.SubElement(variables, 'EnvironmentVariable', key='LEKAPRO_LIVE_CASES', value=os.environ['LIVE_CASES'], isEnabled='YES')
              print('Enabled live demo observations; only sanitized summary will be exported')
          tree.write(scheme, encoding='utf-8', xml_declaration=True)
          PY
      - name: Boot selected simulator
        timeout-minutes: 12
        run: |
          set -o pipefail
          xcrun simctl bootstatus "$SIMULATOR_ID" -b | tee build/simulator-boot.log
      - name: Run simulator tests
        timeout-minutes: 12
        run: |
          set -o pipefail
          # Network-restart fixtures terminate a process shared by WebKit stores.
          # Run them in fresh test-host processes, retaining every assertion.
          xcodebuild -project Lekapro.xcodeproj -scheme Lekapro -destination "platform=iOS Simulator,id=$SIMULATOR_ID" -parallel-testing-enabled NO -derivedDataPath build/simulator -resultBundlePath build/TestResults.xcresult -skip-testing:LekaproTests/BrowserTests/testDisposableIdentityTokenCopyAndVerifiedCombinedReset -skip-testing:LekaproTests/BrowserTests/testNetworkOnlyResetRetainsDisposablePersistentTokens -test-timeouts-enabled YES -default-test-execution-time-allowance 120 -maximum-test-execution-time-allowance 180 CODE_SIGNING_ALLOWED=NO test | tee build/tests.log
      - name: Restart simulator before cold-reset test
        timeout-minutes: 5
        run: |
          # A new test host still shares WebKit's simulator services with the
          # previous suite. End those services before destructive reset fixtures.
          xcrun simctl shutdown "$SIMULATOR_ID" || true
          xcrun simctl bootstatus "$SIMULATOR_ID" -b
      - name: Run isolated cold-reset test
        timeout-minutes: 6
        run: |
          set -o pipefail
          xcodebuild -project Lekapro.xcodeproj -scheme Lekapro -destination "platform=iOS Simulator,id=$SIMULATOR_ID" -parallel-testing-enabled NO -derivedDataPath build/simulator -resultBundlePath build/ColdResetResults.xcresult -only-testing:LekaproTests/BrowserTests/testDisposableIdentityTokenCopyAndVerifiedCombinedReset -test-timeouts-enabled YES -default-test-execution-time-allowance 120 -maximum-test-execution-time-allowance 180 CODE_SIGNING_ALLOWED=NO test | tee build/cold-reset-tests.log
      - name: Restart simulator before network-reset test
        timeout-minutes: 5
        run: |
          xcrun simctl shutdown "$SIMULATOR_ID" || true
          xcrun simctl bootstatus "$SIMULATOR_ID" -b
      - name: Run isolated network-reset test
        timeout-minutes: 6
        run: |
          set -o pipefail
          xcodebuild -project Lekapro.xcodeproj -scheme Lekapro -destination "platform=iOS Simulator,id=$SIMULATOR_ID" -parallel-testing-enabled NO -derivedDataPath build/simulator -resultBundlePath build/NetworkResetResults.xcresult -only-testing:LekaproTests/BrowserTests/testNetworkOnlyResetRetainsDisposablePersistentTokens -test-timeouts-enabled YES -default-test-execution-time-allowance 180 -maximum-test-execution-time-allowance 180 CODE_SIGNING_ALLOWED=NO test | tee build/network-reset-tests.log
      - name: Export sanitized live-probe summary
        if: always() && contains(github.event.head_commit.message, '[live-probe]')
        run: |
          python3 - <<'PY'
          import pathlib, shutil
          # XCTest can stop its simulator before the following Actions step.
          # Read only this explicitly sanitized file, never the app's raw evidence.
          devices = pathlib.Path.home() / 'Library/Developer/CoreSimulator/Devices'
          candidates = list(devices.glob('*/data/Containers/Data/Application/*/Library/Caches/Lekapro-live-probe/sanitized-summary.json'))
          if not candidates:
              raise SystemExit('No live-probe summary was produced')
          shutil.copyfile(max(candidates, key=lambda p: p.stat().st_mtime), 'build/live-probe-summary.json')
          PY
      - name: Upload diagnostics and test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: |
            build/*.log
            build/live-probe-summary.json
            build/*Results.xcresult
          if-no-files-found: ignore
          retention-days: 7
